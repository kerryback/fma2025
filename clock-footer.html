<div id="clock-footer" style="position: fixed; bottom: 10px; right: 80px; font-size: 0.9em; background-color: #c0c0c0; color: black; padding: 4px 8px; border: 2px solid #333; border-radius: 4px; font-family: 'Courier New', monospace; font-weight: bold; z-index: 100;"></div>

<script>
function updateClock() {
  const now = new Date();
  const hours = now.getHours();
  const minutes = now.getMinutes().toString().padStart(2, '0');
  const timeString = `${hours}:${minutes}`;
  document.getElementById('clock-footer').textContent = timeString;
}

updateClock();
setInterval(updateClock, 60000); // Update every minute
</script>
